<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HL2SBPP Addons</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">HL2SBPP <span>Addons</span></a>
  <div class="search"><input id="search" placeholder="Поиск аддонов..."></div>
  <a class="workshop" id="workshopLink" href="#" target="_self">Workshop</a>
</header>
<main>
  <section class="hero">
    <div>
      <p class="eyebrow">HL2SBPP</p>
      <h1>Аддоны</h1>
      <p>Отдельная страница каталога, связанная с Workshop.</p>
    </div>
  </section>
  <div class="toolbar">
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="popular">Популярные</button>
    <button class="filter" data-filter="new">Новые</button>
  </div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" hidden>Аддоны не найдены.</div>
</main>
<script src="/app.js"></script>
</body>
</html>
