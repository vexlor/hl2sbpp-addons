<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HL2SBPP Addons</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">HL2SBPP <span>ADDONS</span></a><nav><a href="/">Аддоны</a><a href="#publish" id="publishNav">Опубликовать</a></nav><div class="auth"><span id="meName"></span><button id="loginBtn">Войти</button><button id="logoutBtn" class="hidden">Выйти</button></div></header><main><section class="hero"><div><small>HL2SBPP ADDONS</small><h1>Аддоны без лишнего.</h1><p>Просматривай, скачивай и публикуй контент для HL2:SB++.</p><div><button class="primary" id="heroPublish">Опубликовать аддон</button></div></div></section><section><div class="section-head"><h2>Аддоны</h2><input id="search" placeholder="Поиск..."></div><div id="grid" class="grid"></div></section><section id="publish" class="publish hidden"><h2>Опубликовать аддон</h2><form id="publishForm"><input name="title" required maxlength="100" placeholder="Название"><div class="row"><select name="category"><option>Models</option><option>Maps</option><option>Weapons</option><option>NPCs</option><option>Vehicles</option><option>Scripts</option><option>Gamemodes</option><option>UI</option><option>Sounds</option><option>Other</option></select><input name="version" value="1.0.0" placeholder="Версия"></div><textarea name="description" maxlength="5000" placeholder="Описание"></textarea><label>Обложка <input name="cover" type="file" accept=".png,.jpg,.jpeg,.webp,.gif"></label><label>Галерея <input name="gallery" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" multiple></label><label>ZIP аддона <input name="package" type="file" accept=".zip" required></label><button class="primary">Опубликовать</button><div id="publishMsg"></div></form></section></main><div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal">×</button><div id="modalBody"></div></div></div><script src="/app.js"></script></body></html>
