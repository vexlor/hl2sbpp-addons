<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HL2SBPP Addons</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="toast" class="toast"></div>
<section id="auth" class="auth-gate"><div class="auth-panel"><div class="brand big"><span class="brand-mark">HL</span><span>HL2SBPP</span><small>ADDONS</small></div>
<div class="auth-switch"><button id="regTab" class="tab active">Регистрация</button><button id="loginTab" class="tab">Вход</button></div>
<form id="reg"><label>Имя пользователя<input name="username" required minlength="3" maxlength="32"></label><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="8" required></label><label>Повторить пароль<input name="repeatPassword" type="password" minlength="8" required></label><button class="primary wide">Создать аккаунт</button></form>
<form id="login" class="hidden"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" required></label><button class="primary wide">Войти</button></form><div id="authMsg" class="message"></div></div></section>
<div id="app" class="hidden"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">HL</span><span>HL2SBPP</span><small>ADDONS</small></a><nav><a href="/">Аддоны</a><a href="/#publish">Опубликовать</a></nav><div class="top-actions"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Поиск аддонов..."></div><span id="userName"></span><button id="logout" class="ghost">Выйти</button></div></header>
<main class="main"><section id="catalog"><div class="hero"><span class="eyebrow">HL2SBPP ADDONS</span><h1>Аддоны</h1><p>Здесь находятся страницы и публикации аддонов.</p><button class="primary" id="goPublish">Опубликовать аддон</button></div><div id="grid" class="addon-grid"></div><div id="empty" class="empty-panel hidden">Аддоны не найдены.</div></section>
<section id="publish" class="publish hidden"><div class="page-title"><h1>Новый аддон</h1><p>Заполни информацию и загрузи ZIP.</p></div><form id="uploadForm" class="publish-grid"><div class="panel"><h3>Информация</h3><label>Название<input name="title" required maxlength="100"></label><div class="two"><label>Категория<select name="category"><option>Models</option><option>Maps</option><option>Weapons</option><option>NPCs</option><option>Vehicles</option><option>Scripts</option><option>Gamemodes</option><option>UI</option><option>Sounds</option><option>Other</option></select></label><label>Версия<input name="version" value="1.0.0"></label></div><label>Описание<textarea name="description" maxlength="5000" rows="10"></textarea></label></div><div class="panel"><h3>Файлы</h3><label class="file-drop">Обложка<input name="cover" type="file" accept=".png,.jpg,.jpeg,.webp,.gif"></label><label class="file-drop">Дополнительные изображения<input name="gallery" type="file" accept=".png,.jpg,.jpeg,.webp,.gif" multiple></label><label class="file-drop">ZIP аддона<input name="package" type="file" accept=".zip" required></label><button class="primary wide">Опубликовать</button><div id="uploadMsg" class="message"></div></div></form></section></main></div><script src="/addons.js"></script></body></html>
